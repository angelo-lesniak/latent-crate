name: "${COMPOSE_PROJECT_NAME:?exported by bin/latentcrate from .env}"

# Interpolation: every setting of .env.example, every pin of pins.env, and
# the values the wrapper derives (HOST_UID, HOST_GID, LATENTCRATE_IMAGE,
# COMFY_BUILD_TARGET, FRONTEND_GIT_*) are required (`:?`): bin/latentcrate
# exports each on every Compose call. `?` rather than `:?` marks a value
# that is empty by design.

# Shared configuration for the node-set and node-set-status services. The
# services below merge this block and override only their real differences:
# networking, the writability of the /nodes mount, and the command.
x-node-set-common: &node-set-common
  profiles: ["tools"]
  image: "${LATENTCRATE_TOOLS_IMAGE:-latentcrate/tools}:${LATENTCRATE_TOOLS_TAG:-current}-node-set"
  build:
    context: .
    dockerfile: services/tools/Dockerfile
    target: node-set-tool
  read_only: true
  pids_limit: 128
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  environment:
    PYTHONDONTWRITEBYTECODE: "1"

x-node-set-mounts:
  manifest: &node-set-manifest-mount
    type: bind
    source: "${NODE_SET_FILE:-./config/custom-nodes/sets/latent-nodepack.toml}"
    target: /config/node-set.toml
    read_only: true
  allowed-git-hosts: &node-set-allowed-git-hosts-mount
    type: bind
    source: ./config/custom-nodes/allowed-git-hosts.txt
    target: /config/allowed-git-hosts.txt
    read_only: true
  tmp: &node-set-tmp-mount
    type: tmpfs
    target: /tmp

# Model downloads use a dedicated, short-lived helper. The Hugging Face token
# is piped to its stdin by bin/latentcrate and is never stored in Compose
# configuration, an image layer, or a container environment variable.
x-model-set-common: &model-set-common
  profiles: ["tools"]
  image: "${LATENTCRATE_TOOLS_IMAGE:-latentcrate/tools}:${LATENTCRATE_TOOLS_TAG:-current}-model-set"
  build:
    context: .
    dockerfile: services/tools/Dockerfile
    target: model-set-tool
  read_only: true
  pids_limit: 128
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  environment:
    MODEL_SET_EXTRA_WRITE_ROOTS: "${MODEL_SET_EXTRA_WRITE_ROOTS:-}"
  volumes:
    - type: bind
      source: ./config/model-sets
      target: /config/model-sets
      read_only: true
    - type: bind
      source: "${COMFY_MODELS_DIR:-./data/models}"
      target: /models
    - type: bind
      source: "${COMFY_CACHE_DIR:-./data/cache}/huggingface"
      target: /cache
    - type: tmpfs
      target: /tmp

# Template inspection uses the exact workflow-template package installed in
# the selected ComfyUI image. Both operations are offline; only draft creation
# receives a writable host directory.
x-template-common: &template-common
  profiles: ["tools"]
  image: "${LATENTCRATE_IMAGE:?set by bin/latentcrate}"
  entrypoint: ["python", "/usr/local/bin/latentcrate-manage-templates.py"]
  network_mode: none
  read_only: true
  pids_limit: 128
  cap_drop: ["ALL"]
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  comfy:
    image: "${LATENTCRATE_IMAGE:?set by bin/latentcrate}"
    build:
      context: .
      dockerfile: services/comfy/Dockerfile
      target: "${COMFY_BUILD_TARGET:?set by bin/latentcrate}"
      # Every pin is an argument so an image never builds from a value that
      # is not in pins.env.
      args:
        PYTORCH_DEVEL_TAG: "${PYTORCH_DEVEL_TAG:?pin it in pins.env}"
        PYTORCH_DEVEL_DIGEST: "${PYTORCH_DEVEL_DIGEST:?pin it in pins.env}"
        PYTORCH_RUNTIME_TAG: "${PYTORCH_RUNTIME_TAG:?pin it in pins.env}"
        PYTORCH_RUNTIME_DIGEST: "${PYTORCH_RUNTIME_DIGEST:?pin it in pins.env}"
        FRONTEND_NODE_TAG: "${FRONTEND_NODE_TAG:?pin it in pins.env}"
        FRONTEND_NODE_DIGEST: "${FRONTEND_NODE_DIGEST:?pin it in pins.env}"
        COMFYUI_REF: "${COMFYUI_REF:?pin it in pins.env}"
        COMFYUI_FRONTEND_REF: "${COMFYUI_FRONTEND_REF:?pin it in pins.env}"
        FFMPEG_REF: "${FFMPEG_REF:?pin it in pins.env}"
        NV_CODEC_HEADERS_REF: "${NV_CODEC_HEADERS_REF:?pin it in pins.env}"
        SVT_AV1_REF: "${SVT_AV1_REF:?pin it in pins.env}"
        SAGEATTENTION_REF: "${SAGEATTENTION_REF:?pin it in pins.env}"
        FRONTEND_PNPM_VERSION: "${FRONTEND_PNPM_VERSION:?pin it in pins.env}"
        CUDA_NPP_VERSION: "${CUDA_NPP_VERSION:?pin it in pins.env}"
        TORCHCODEC_VERSION: "${TORCHCODEC_VERSION:?pin it in pins.env}"
        COMFY_CUDA_ARCH_LIST: "${COMFY_CUDA_ARCH_LIST:?exported by bin/latentcrate from .env}"
        SAGE_BUILD_JOBS: "${SAGE_BUILD_JOBS:?exported by bin/latentcrate from .env}"
        # The wrapper resolves the frontend ref (the pinned tag in release
        # mode) to a commit for every runtime build; dist mode leaves them empty.
        FRONTEND_GIT_URL: "${FRONTEND_GIT_URL?set by bin/latentcrate}"
        FRONTEND_GIT_REF: "${FRONTEND_GIT_REF?set by bin/latentcrate}"
        FRONTEND_GIT_REQUESTED_REF: "${FRONTEND_GIT_REQUESTED_REF?set by bin/latentcrate}"
    user: "${HOST_UID:?set by bin/latentcrate}:${HOST_GID:?set by bin/latentcrate}"
    init: true
    read_only: true
    restart: "${RESTART_POLICY:?exported by bin/latentcrate from .env}"
    stop_grace_period: "${STOP_GRACE_PERIOD:?exported by bin/latentcrate from .env}"
    shm_size: "${COMFY_SHM_SIZE:?exported by bin/latentcrate from .env}"
    pids_limit: "${COMFY_PIDS_LIMIT:?exported by bin/latentcrate from .env}"
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - "/tmp:rw,nosuid,nodev,mode=1777,size=${COMFY_TMPFS_SIZE:?exported by bin/latentcrate from .env}"
    ports:
      # Container port 8188 must match the --port in services/comfy/entrypoint.sh
      # and the probe URL in services/comfy/healthcheck.py.
      - "${COMFY_BIND_ADDRESS:?exported by bin/latentcrate from .env}:${COMFY_PORT:?exported by bin/latentcrate from .env}:8188"
    # The GPU device request lives in compose.gpu.yaml so that `templates`,
    # a CPU render, and --allow-no-gpu need no CDI device.
    volumes:
      - type: bind
        source: "${COMFY_DATA_DIR:?exported by bin/latentcrate from .env}"
        target: /data
      - type: bind
        source: "${COMFY_MODELS_DIR:?exported by bin/latentcrate from .env}"
        target: /models
      - type: bind
        source: "${COMFY_CACHE_DIR:?exported by bin/latentcrate from .env}"
        target: /cache
      - type: bind
        source: "${COMFY_LOCAL_NODES_DIR:?exported by bin/latentcrate from .env}"
        target: /local/custom_nodes
        read_only: true
    environment:
      COMFY_ENABLE_MANAGER: "${COMFY_ENABLE_MANAGER:?exported by bin/latentcrate from .env}"
      COMFY_FRONTEND_MODE: "${COMFY_FRONTEND_MODE:?set by bin/latentcrate}"
      # The setting's values are the modes the entrypoint reads, so it is
      # passed through unchanged.
      LATENTCRATE_SAGE_MODE: "${LATENTCRATE_SAGE:?exported by bin/latentcrate from .env}"
      COMFY_DISABLE_API_NODES: "${COMFY_DISABLE_API_NODES:?exported by bin/latentcrate from .env}"
      COMFY_DISABLE_METADATA: "${COMFY_DISABLE_METADATA:?exported by bin/latentcrate from .env}"
      COMFYUI_EXTRA_ARGS: "${COMFYUI_EXTRA_ARGS?exported by bin/latentcrate from .env}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES:?exported by bin/latentcrate from .env}"
      UMASK: "${UMASK:?exported by bin/latentcrate from .env}"
    healthcheck:
      test: ["CMD", "python", "/usr/local/bin/latentcrate-healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  node-deps-snapshot:
    profiles: ["tools"]
    image: "${LATENTCRATE_TOOLS_IMAGE:-latentcrate/tools}:${LATENTCRATE_TOOLS_TAG:-current}-node-deps"
    build:
      context: .
      dockerfile: services/tools/Dockerfile
      target: node-deps-tool
    network_mode: none
    read_only: true
    pids_limit: 128
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    command:
      - --source
      - /input/managed
      - --source
      - /input/local
      - --destination
      - /output/custom-node-requirements
      - --include-file
      - /config/custom-node-requirements.include
      - --vcs-pins
      - /config/vcs-pins.toml
      - --package-replacements
      - /config/custom-node-package-replacements.toml
      - --allowed-git-hosts
      - /config/allowed-git-hosts.txt
    volumes:
      - type: bind
        source: "${NODE_DEPS_SOURCE_DIR:-./data/comfy/custom_nodes}"
        target: /input/managed
        read_only: true
      - type: bind
        source: "${NODE_DEPS_LOCAL_SOURCE_DIR:-./local/custom_nodes}"
        target: /input/local
        read_only: true
      - type: bind
        source: "${NODE_DEPS_OUTPUT_DIR:-./build}"
        target: /output
      - type: bind
        source: ./config/python/custom-node-requirements.include
        target: /config/custom-node-requirements.include
        read_only: true
      - type: bind
        source: ./config/custom-nodes/vcs-pins.toml
        target: /config/vcs-pins.toml
        read_only: true
      - type: bind
        source: ./config/python/custom-node-package-replacements.toml
        target: /config/custom-node-package-replacements.toml
        read_only: true
      - type: bind
        source: ./config/custom-nodes/allowed-git-hosts.txt
        target: /config/allowed-git-hosts.txt
        read_only: true
      - type: tmpfs
        target: /tmp

  node-set:
    <<: *node-set-common
    command:
      - "${NODE_SET_ACTION:-status}"
      - --manifest
      - /config/node-set.toml
      - --target
      - /nodes
      - --allowed-git-hosts
      - /config/allowed-git-hosts.txt
    volumes:
      - *node-set-manifest-mount
      - type: bind
        source: "${NODE_SET_TARGET_DIR:-./data/comfy/custom_nodes}"
        target: /nodes
      - *node-set-allowed-git-hosts-mount
      - *node-set-tmp-mount

  node-set-status:
    <<: *node-set-common
    network_mode: none
    command:
      - status
      - --manifest
      - /config/node-set.toml
      - --target
      - /nodes
      - --allowed-git-hosts
      - /config/allowed-git-hosts.txt
    volumes:
      - *node-set-manifest-mount
      - type: bind
        source: "${NODE_SET_TARGET_DIR:-./data/comfy/custom_nodes}"
        target: /nodes
        read_only: true
      - *node-set-allowed-git-hosts-mount
      - *node-set-tmp-mount

  model-set:
    <<: *model-set-common

  model-set-status:
    <<: *model-set-common
    network_mode: none
    volumes:
      - type: bind
        source: ./config/model-sets
        target: /config/model-sets
        read_only: true
      - type: bind
        source: "${COMFY_MODELS_DIR:-./data/models}"
        target: /models
        read_only: true
      - type: tmpfs
        target: /tmp

  template-inspector:
    <<: *template-common

  template-draft:
    <<: *template-common
    volumes:
      - type: bind
        source: "${TEMPLATE_DRAFT_OUTPUT_DIR:-./build/model-set-drafts}"
        target: /output

  frontend-fetch:
    profiles: ["tools"]
    image: "${LATENTCRATE_TOOLS_IMAGE:-latentcrate/tools}:${LATENTCRATE_TOOLS_TAG:-current}-frontend"
    build:
      context: .
      dockerfile: services/tools/Dockerfile
      target: frontend-local-tool
      args:
        FRONTEND_PNPM_VERSION: "${FRONTEND_PNPM_VERSION:?pin it in pins.env}"
    read_only: true
    pids_limit: 256
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["fetch"]
    volumes:
      - type: bind
        source: "${FRONTEND_SOURCE_DIR:-.}"
        target: /source
        read_only: true
      - type: bind
        source: "${FRONTEND_PNPM_CACHE_DIR:-./data/cache/frontend-pnpm}"
        target: /pnpm/store
      - type: bind
        source: "${FRONTEND_WORK_DIR:-./data/cache/frontend-work/default}"
        target: /work
      - type: tmpfs
        target: /tmp

  frontend-build:
    profiles: ["tools"]
    image: "${LATENTCRATE_TOOLS_IMAGE:-latentcrate/tools}:${LATENTCRATE_TOOLS_TAG:-current}-frontend"
    build:
      context: .
      dockerfile: services/tools/Dockerfile
      target: frontend-local-tool
      args:
        FRONTEND_PNPM_VERSION: "${FRONTEND_PNPM_VERSION:?pin it in pins.env}"
    network_mode: none
    read_only: true
    pids_limit: 512
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    command: ["build"]
    volumes:
      - type: bind
        source: "${FRONTEND_SOURCE_DIR:-.}"
        target: /source
        read_only: true
      - type: bind
        source: "${FRONTEND_OUTPUT_DIR:-./data/cache/frontend-builds/default}"
        target: /output
      - type: bind
        source: "${FRONTEND_PNPM_CACHE_DIR:-./data/cache/frontend-pnpm}"
        target: /pnpm/store
      - type: bind
        source: "${FRONTEND_WORK_DIR:-./data/cache/frontend-work/default}"
        target: /work
      - type: tmpfs
        target: /tmp
