# Rootless Podman maps the host user into the container with keep-id so
# bind-mounted files keep their ownership. Docker needs only `user:`, which
# compose.yaml sets.
services:
  comfy:
    userns_mode: "keep-id:uid=${HOST_UID:?set by bin/latentcrate},gid=${HOST_GID:?set by bin/latentcrate}"
    group_add:
      - keep-groups
  node-deps-snapshot:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  node-set:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  node-set-status:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  model-set:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
    group_add:
      - keep-groups
  model-set-status:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
    group_add:
      - keep-groups
  template-inspector:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  template-draft:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  frontend-fetch:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
  frontend-build:
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    userns_mode: "keep-id:uid=${HOST_UID:-1000},gid=${HOST_GID:-1000}"
