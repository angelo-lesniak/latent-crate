version: 2

# The base images are pinned by tag and digest in pins.env, which Dependabot
# cannot read; `pins check` is their update path, so a `docker` entry here
# would find nothing.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python-development:
        patterns:
          - "*"
