name: Bug report
description: Report a reproducible LatentCrate problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials, private model paths, or vulnerability
        details. Use GitHub private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: pins
    attributes:
      label: Pins and selection
      description: >-
        Paste the output of `bash bin/latentcrate pins` and
        `git rev-parse --short HEAD`, and name the frontend mode and the Sage
        mode.
      placeholder: release, off
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Container engine
      options:
        - Rootless Podman with podman-compose
        - Docker Engine with Compose v2
        - Other / configuration only
    validations:
      required: true
  - type: textarea
    id: host
    attributes:
      label: Host and GPU details
      description: >-
        Include OS, engine/Compose, NVIDIA driver, GPU, and nvidia-ctk versions
        when relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or reports
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials and private paths from this report.
          required: true
        - label: I ran `bash bin/latentcrate doctor` when the problem involves the host or the GPU.
          required: false
