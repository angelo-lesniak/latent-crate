name: static

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        # The floor bin/latentcrate enforces; a newer interpreter would hide
        # a syntax or library use the floor lacks.
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install static tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep shellcheck
          python3 -m pip install -r requirements-dev.txt

      - name: Run project checks
        # The runner checks out only tracked files, so this is also the proof
        # that the gate needs no untracked artifact from a developer checkout.
        env:
          # A missing tool must fail CI, never silently skip its component.
          LATENTCRATE_STATIC_STRICT: "1"
        run: bash tests/static.sh

      - name: Lint the Dockerfile
        run: |
          docker run --rm --interactive hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d \
            hadolint --failure-threshold warning - < services/comfy/Dockerfile
