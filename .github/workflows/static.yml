name: static

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install static tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep shellcheck
          python3 -m pip install -r requirements-dev.txt

      - name: Run project checks
        env:
          # A missing tool must fail CI, never silently skip its component.
          LATENTCRATE_STATIC_STRICT: "1"
        run: bash tests/static.sh

      - name: Lint Dockerfile
        run: |
          for dockerfile in services/comfy/Dockerfile services/tools/Dockerfile; do
            docker run --rm --interactive hadolint/hadolint:v2.12.0 \
              hadolint --failure-threshold warning - < "$dockerfile"
          done

      - name: Build and verify the model-set helper
        run: |
          set -Eeuo pipefail
          set -a
          source versions/current.env
          set +a
          docker build \
            --target model-set-tool \
            --build-arg "TOOL_PYTHON_IMAGE=${TOOL_PYTHON_IMAGE}" \
            --build-arg "FRONTEND_NODE_IMAGE=${FRONTEND_NODE_IMAGE}" \
            --tag latentcrate/model-set-test \
            --file services/tools/Dockerfile \
            .
          mkdir -p build/model-set-ci/models build/model-set-ci/cache
          model_tool=(
            --rm
            --read-only
            --user "$(id -u):$(id -g)"
            --cap-drop ALL
            --security-opt no-new-privileges
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777
            --volume "$PWD/tests/fixtures/model-sets:/config/model-sets:ro"
          )
          printf '' | docker run --interactive "${model_tool[@]}" \
            --volume "$PWD/build/model-set-ci/models:/models" \
            --volume "$PWD/build/model-set-ci/cache:/cache" \
            latentcrate/model-set-test \
            fetch --token-stdin hf-smoke
          docker run "${model_tool[@]}" \
            --network none \
            --volume "$PWD/build/model-set-ci/models:/models:ro" \
            latentcrate/model-set-test \
            status hf-smoke
