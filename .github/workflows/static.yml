name: static

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install static tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep shellcheck
          python3 -m pip install -r requirements-dev.txt

      - name: Run project checks
        env:
          # A missing tool must fail CI, never silently skip its component.
          LATENTCRATE_STATIC_STRICT: "1"
        run: bash tests/static.sh

      - name: Lint Dockerfile
        run: |
          for dockerfile in services/comfy/Dockerfile services/tools/Dockerfile; do
            docker run --rm --interactive hadolint/hadolint:v2.12.0 \
              hadolint --failure-threshold warning - < "$dockerfile"
          done
