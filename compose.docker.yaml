# Docker Engine: the supplementary group that owns shared or NAS model
# storage, since Docker maps no host group into the container. bin/latentcrate
# exports HOST_MODEL_GID from .env, or the calling user's group when .env
# leaves it unset.
services:
  comfy:
    group_add:
      - "${HOST_MODEL_GID:?exported by bin/latentcrate}"
