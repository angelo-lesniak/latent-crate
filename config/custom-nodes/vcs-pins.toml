version = 1

# Some third-party nodes depend on a changeable Git branch instead of a release.
# LatentCrate rewrites matching requirements only in its saved build input; it
# never edits the third-party node's own files. Full commits let pip and BuildKit
# reuse the resulting wheel across builds.
[[pin]]
# Upstream calls the installable distribution SAM-2; Python imports it as sam2.
package = "sam-2"
repository = "https://github.com/facebookresearch/sam2.git"
requested_ref = ""
commit = "2b90b9f5ceec907a1c18123530e92e794ad901a4"

[[pin]]
package = "img2texture"
repository = "https://github.com/ltdrdata/img2texture.git"
requested_ref = ""
commit = "d6159abea44a0b2cf77454d3d46962c8b21eb9d3"

[[pin]]
package = "cstr"
repository = "https://github.com/ltdrdata/cstr.git"
requested_ref = ""
commit = "0520c29a18a7a869a6e5983861d6f7a4c86f8e9b"

[[pin]]
package = "ffmpy"
repository = "https://github.com/ltdrdata/ffmpy.git"
